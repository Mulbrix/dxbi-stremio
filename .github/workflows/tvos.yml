name: Apple TV app

# Builds dx.bi for Apple TV (tvos/) on a Mac and keeps dxbi-tv.ipa as a workflow artifact; publishing a
# release attaches it to the release. The IPA isn't signed: Sideloadly signs it with your own Apple ID
# when it installs it.
on:
  push:
    paths:
      - tvos/**
      - ios/Dxbi/Engine/**
      - ios/Dxbi/Player/**
      - ios/Dxbi/UI/Theme.swift
      - ios/Dxbi/UI/Cards.swift
      - dxbi.plugin.js
      - tv/app/src/main/assets/dxbi-tv.js
      - tv/app/src/mobile/assets/dxbi-engine.js
      - .github/workflows/tvos.yml
  pull_request:
    paths:
      - tvos/**
      - ios/Dxbi/Engine/**
      - ios/Dxbi/Player/**
      - .github/workflows/tvos.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      runner:
        description: "Mac to build on (GitHub's Apple-chip Macs, macos-26, were often busy: the default is Intel)"
        default: macos-15-intel

permissions:
  contents: write

concurrency:
  group: tvos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    defaults:
      run:
        working-directory: tvos
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install xcodegen
          # the newest Xcode 26 on this Mac
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version
          # tvOS's platform isn't always installed with Xcode
          xcodebuild -showsdks | grep -q appletvos || xcodebuild -downloadPlatform tvOS
          xcodebuild -showsdks | grep appletvos

      # MPVKit (the player) is a large download: kept between runs
      - uses: actions/cache@v4
        with:
          path: tvos/build/SourcePackages
          key: spm-tvos-${{ hashFiles('tvos/project.yml') }}

      - name: Build
        run: |
          set -o pipefail
          # the app has dx.bi's version (the plugin's), like the other apps
          version=$(grep -m1 -oE '@version[[:space:]]+[0-9.]+' ../dxbi.plugin.js | awk '{print $2}')
          xcodegen generate
          xcodebuild build \
            -project Dxbi.xcodeproj -scheme Dxbi -configuration Release \
            -destination 'generic/platform=tvOS' -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            DXBI_UPDATE_REPO="${{ github.repository }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | xcbeautify --renderer github-actions
          mkdir -p Payload
          cp -R build/Build/Products/Release-appletvos/Dxbi.app Payload/
          zip -qry dxbi-tv.ipa Payload
          ls -lh dxbi-tv.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: dxbi-tv
          path: tvos/dxbi-tv.ipa
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dxbi-tv.ipa --clobber
        env:
          GH_TOKEN: ${{ github.token }}
