# dx.bi for Apple TV. XcodeGen makes the Xcode project from this (`xcodegen` in tvos/; the .xcodeproj
# isn't kept in git). GitHub Actions builds it on a Mac: .github/workflows/tvos.yml
#
# Most of it is the iPhone app's (ios/Dxbi): Stremio's engine and the models, the mpv player and the
# cards. tvOS has its own screens (for the Siri Remote), its own way into WebKit (DxWebView), and its
# own player screen.
name: Dxbi
options:
  bundleIdPrefix: com.notdxbi
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    # where the app looks for its updates: the repository it was built from (the build sets it)
    DXBI_UPDATE_REPO: notdxbi/dxbi-stremio
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  # Streamyfin's build of MPVKit, as the iPhone app's
  MPVKit:
    url: https://github.com/streamyfin/MPVKit.git
    exactVersion: 0.41.0-av5
targets:
  Dxbi:
    type: application
    platform: tvOS
    sources:
      - path: Dxbi
      # The iPhone app's, shared
      - path: ../ios/Dxbi/Engine/Stremio.swift
        group: Shared
      - path: ../ios/Dxbi/Engine/Models.swift
        group: Shared
      - path: ../ios/Dxbi/Engine/JSON.swift
        group: Shared
      - path: ../ios/Dxbi/Engine/Updates.swift
        group: Shared
      - path: ../ios/Dxbi/Player/MPV.swift
        group: Shared
      - path: ../ios/Dxbi/Player/Playback.swift
        group: Shared
      - path: ../ios/Dxbi/Player/PictureInPicture.swift
        group: Shared
      - path: ../ios/Dxbi/Player/OtherApp.swift
        group: Shared
      - path: ../ios/Dxbi/UI/Theme.swift
        group: Shared
      - path: ../ios/Dxbi/UI/Cards.swift
        group: Shared
      # The engine the app runs underneath: the same scripts the other apps use
      - path: ../dxbi.plugin.js
        buildPhase: resources
      - path: ../tv/app/src/main/assets/dxbi-tv.js
        buildPhase: resources
      - path: ../tv/app/src/mobile/assets/dxbi-engine.js
        buildPhase: resources
      - path: ../tv/app/src/mobile/res/font/bebas_neue.ttf
        buildPhase: resources
    dependencies:
      - package: MPVKit
        product: MPVKit-GPL
    info:
      path: Dxbi/Info.plist
      properties:
        CFBundleDisplayName: dx.bi
        DxbiUpdateRepo: $(DXBI_UPDATE_REPO)
        DxbiUpdateAsset: dxbi-tv.ipa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        UIAppFonts:
          - bebas_neue.ttf
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities:
          - arm64
        ITSAppUsesNonExemptEncryption: false
        # A streaming server on the network (Stremio or dx.bi on a computer) plays torrents for the TV
        NSLocalNetworkUsageDescription: dx.bi reaches a Stremio streaming server on your network to play torrents.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # "Play videos in" another app
        LSApplicationQueriesSchemes:
          - infuse
          - vlc-x-callback
          - vlc
          - outplayer
          - senplayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notdxbi.dxbi.tvos
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        SWIFT_OBJC_BRIDGING_HEADER: Dxbi/Engine/Dxbi-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
